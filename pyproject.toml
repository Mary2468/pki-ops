[project]
name = "pki-ops"
version = "0.1.0"
description = "Mini-PKI Ã  deux niveaux opÃ©rÃ©e par des agents IA, avec humain dans la boucle"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AIT BOUHADI Maryame" }]
dependencies = [
    "cryptography>=43",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "psutil>=6.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "matplotlib>=3.9", "markdown>=3.6"]

[project.scripts]
pkiops = "pki_ops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pki_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/pki_ops/outils"]
